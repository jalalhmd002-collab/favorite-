<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141722"/>
      <stop offset="50%" stop-color="#0F111A"/>
      <stop offset="100%" stop-color="#07080C"/>
    </linearGradient>

    <!-- Ambient Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#F59E0B" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>

    <!-- Bookmark Body Gradient -->
    <linearGradient id="bookmarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="45%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Bookmark Inner Highlight -->
    <linearGradient id="innerHighlight" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </linearGradient>

    <!-- Star Gradient -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadowMain" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.65"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#F59E0B" flood-opacity="0.25"/>
    </filter>

    <filter id="starShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#78350F" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#ambientGlow)"/>
  <rect x="16" y="16" width="480" height="480" rx="116" fill="none" stroke="url(#borderGrad)" stroke-width="3"/>

  <!-- Bookmark Ribbon Container -->
  <g filter="url(#shadowMain)">
    <!-- Main Bookmark Shape -->
    <path d="M168 108 C168 96 178 86 190 86 L322 86 C334 86 344 96 344 108 L344 394 C344 406 331 414 321 407 L256 360 L191 407 C181 414 168 406 168 394 Z"
          fill="url(#bookmarkGrad)"/>

    <!-- Subtle Inner Bevel / Highlight -->
    <path d="M172 110 C172 99 180 90 191 90 L321 90 C332 90 340 99 340 110 L340 388 L256 327 L172 388 Z"
          fill="none" stroke="url(#innerHighlight)" stroke-width="3" opacity="0.8"/>

    <!-- Glowing Star Center Emblem -->
    <polygon points="256,162 273,212 327,212 284,244 300,296 256,264 212,296 228,244 185,212 239,212"
             fill="url(#starGrad)"
             filter="url(#starShadow)"/>

    <!-- Decorative Web Link Loops (Connecting Node Lines) -->
    <g opacity="0.95" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Left Link Arc -->
      <path d="M228 328 C220 328 214 322 214 314 C214 306 220 300 228 300 L240 300"/>
      <!-- Right Link Arc -->
      <path d="M284 328 C292 328 298 322 298 314 C298 306 292 300 284 300 L272 300"/>
      <!-- Connection Center Link -->
      <line x1="238" y1="314" x2="274" y2="314" stroke="#FFFBEB" stroke-width="5"/>
    </g>
  </g>
</svg>
